name: umu-launcher

on:
  push:
    branches: [master, claude/bold-einstein-sswx3m]
    paths:
      - "apps/umu-launcher/**"
      - ".github/workflows/umu-launcher.yml"
  pull_request:
    paths:
      - "apps/umu-launcher/**"
      - ".github/workflows/umu-launcher.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: ubuntu
            context: apps/umu-launcher/build
            base_app_image: ghcr.io/games-on-whales/base-app:edge
            tags: |
              edge
              latest
          - variant: fedora
            context: apps/umu-launcher/build-fedora
            base_app_image: ghcr.io/games-on-whales/base-app:fedora
            tags: |
              fedora
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/umu-launcher" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: tags
        run: |
          {
            echo "list<<EOF"
            while read -r t; do [ -n "$t" ] && echo "${IMAGE}:${t}"; done <<< "${{ matrix.tags }}"
            echo "${IMAGE}:${{ matrix.variant }}-sha-${GITHUB_SHA::7}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.list }}
          build-args: |
            BASE_APP_IMAGE=${{ matrix.base_app_image }}
            IMAGE_SOURCE=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,scope=${{ matrix.variant }},mode=max
